name: Standalone Agent Daemon

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'src/kernel/buckyos_agent_daemon/**'
      - 'src/kernel/node_executor/**'
      - 'src/kernel/buckyos-api/src/agent_daemon*'
      - 'src/kernel/buckyos-api/src/computer*'
      - 'src/kernel/buckyos-api/src/node_executor*'
      - 'src/tools/package_agent_daemon.py'
      - 'src/tools/tests/test_package_agent_daemon.py'
      - '.github/workflows/agent-daemon.yml'

permissions:
  contents: read

jobs:
  standalone:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-musl
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
          - runner: macos-15
            target: aarch64-apple-darwin
          - runner: macos-15-intel
            target: x86_64-apple-darwin
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install musl C and C++ toolchain
        if: matrix.target == 'x86_64-unknown-linux-musl'
        env:
          TOOLCHAIN_URL: https://github.com/musl-cc/musl.cc/releases/download/v0.0.1/x86_64-linux-musl-cross.tgz
          TOOLCHAIN_SHA512: 52abd1a56e670952116e35d1a62e048a9b6160471d988e16fa0e1611923dd108a581d2e00874af5eb04e4968b1ba32e0eb449a1f15c3e4d5240ebe09caf5a9f3
        run: |
          curl --fail --location --output "$RUNNER_TEMP/musl.tgz" "$TOOLCHAIN_URL"
          printf '%s  %s\n' "$TOOLCHAIN_SHA512" "$RUNNER_TEMP/musl.tgz" | sha512sum --check --strict
          tar -xzf "$RUNNER_TEMP/musl.tgz" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/x86_64-linux-musl-cross/bin" >> "$GITHUB_PATH"
      - name: Regression tests
        working-directory: src
        run: cargo test -p node_executor -p buckyos_agent_daemon -- --test-threads=1
      - name: Package tests
        run: python3 -m unittest discover -s src/tools/tests -p 'test_package_agent_daemon.py'
      - name: Package standalone binary
        run: python3 src/tools/package_agent_daemon.py --target '${{ matrix.target }}' --output dist/agent-daemon
      - name: Validate archive checksum and foreground execution
        run: |
          python3 - <<'PY'
          import hashlib, pathlib, subprocess, tarfile
          archive, = pathlib.Path('dist/agent-daemon').glob('*.tar.gz')
          expected = archive.with_name(archive.name + '.sha256').read_text().split()[0]
          assert hashlib.sha256(archive.read_bytes()).hexdigest() == expected
          with tarfile.open(archive) as payload:
              payload.extractall('dist/agent-daemon/unpacked', filter='data')
          binary, = pathlib.Path('dist/agent-daemon/unpacked').glob('*/buckyos_agent_daemon')
          subprocess.run([str(binary), 'doctor', '--json'], check=True)
          PY
      - uses: actions/upload-artifact@v6
        with:
          name: agent-daemon-${{ matrix.target }}
          path: dist/agent-daemon/*
