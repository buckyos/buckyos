name: Agent Daemon Release

# Builds the standalone BuckyOS Agent Daemon for six targets and, on a release
# tag or an explicit dispatch, publishes two GitHub Releases:
#   agent-daemon-v<src/VERSION>  immutable, versioned file names
#   agent-daemon-latest          rolling, unversioned file names + latest.json
# Stable download links:
#   https://github.com/buckyos/buckyos/releases/download/agent-daemon-latest/buckyos-agent-daemon-<target>.tar.gz|.zip
#   https://github.com/buckyos/buckyos/releases/download/agent-daemon-latest/start-buckyos-agent-daemon.sh
#   https://github.com/buckyos/buckyos/releases/download/agent-daemon-latest/latest.json
# Pull requests and plain dispatches only build and upload workflow artifacts.

on:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish GitHub Release agent-daemon-v<src/VERSION> and refresh agent-daemon-latest
        type: boolean
        default: false
      allow_missing:
        description: Publish even if some targets failed to build
        type: boolean
        default: false
  push:
    tags:
      - 'agent-daemon-v*'
  pull_request:
    paths:
      - 'src/kernel/buckyos_agent_daemon/**'
      - 'src/kernel/node_executor/**'
      - 'src/kernel/computer_driver/**'
      - 'src/kernel/buckyos-api/src/agent_daemon*'
      - 'src/kernel/buckyos-api/src/computer*'
      - 'src/kernel/buckyos-api/src/node_executor*'
      - 'src/rootfs/bin/buckyos-agent-daemon/**'
      - 'src/tools/package_agent_daemon.py'
      - 'src/tools/tests/test_package_agent_daemon.py'
      - 'test/agent_daemon/test_launcher.py'
      - '.github/scripts/agent_daemon_*.py'
      - '.github/scripts/test_agent_daemon_*.py'
      - '.github/workflows/agent-daemon.yml'

permissions:
  contents: read

concurrency:
  group: agent-daemon-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  PYTHONUTF8: '1'

jobs:
  build:
    name: ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-musl
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
          - runner: macos-15
            target: aarch64-apple-darwin
          - runner: macos-15-intel
            target: x86_64-apple-darwin
          - runner: windows-2025
            target: x86_64-pc-windows-msvc
          - runner: windows-11-arm
            target: aarch64-pc-windows-msvc
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Setup MSVC developer environment
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Cache musl C/C++ toolchain
        if: matrix.target == 'x86_64-unknown-linux-musl'
        id: musl-toolchain-cache
        uses: actions/cache@v5
        with:
          path: ${{ runner.temp }}/x86_64-linux-musl-cross
          key: musl-cc-v0.0.1-x86_64-linux-musl-cross-52abd1a56e670952116e35d1a62e048a9b6160471d988e16fa0e1611923dd108a581d2e00874af5eb04e4968b1ba32e0eb449a1f15c3e4d5240ebe09caf5a9f3
      - name: Install musl C/C++ toolchain
        if: matrix.target == 'x86_64-unknown-linux-musl' && steps.musl-toolchain-cache.outputs.cache-hit != 'true'
        env:
          TOOLCHAIN_URL: https://github.com/musl-cc/musl.cc/releases/download/v0.0.1/x86_64-linux-musl-cross.tgz
          TOOLCHAIN_SHA512: 52abd1a56e670952116e35d1a62e048a9b6160471d988e16fa0e1611923dd108a581d2e00874af5eb04e4968b1ba32e0eb449a1f15c3e4d5240ebe09caf5a9f3
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 --output "$RUNNER_TEMP/musl.tgz" "$TOOLCHAIN_URL"
          printf '%s  %s\n' "$TOOLCHAIN_SHA512" "$RUNNER_TEMP/musl.tgz" | sha512sum --check --strict
          tar -xzf "$RUNNER_TEMP/musl.tgz" -C "$RUNNER_TEMP"
      - name: Use musl C/C++ toolchain
        if: matrix.target == 'x86_64-unknown-linux-musl'
        run: echo "$RUNNER_TEMP/x86_64-linux-musl-cross/bin" >> "$GITHUB_PATH"
      - name: Regression tests
        working-directory: src
        run: cargo test -p node_executor -p buckyos_agent_daemon -- --test-threads=1
      - name: Package tests
        run: python -m unittest discover -s src/tools/tests -p 'test_package_agent_daemon.py'
      - name: Launcher and release assembly tests
        if: runner.os == 'Linux'
        run: |
          python3 -m unittest discover -s test/agent_daemon -p 'test_launcher.py'
          python3 -m unittest discover -s .github/scripts -p 'test_agent_daemon_release.py'
      - name: Package release archive
        run: python src/tools/package_agent_daemon.py --target '${{ matrix.target }}' --output dist/agent-daemon
      - name: Verify archive, manifest, doctor and dynamic dependencies
        run: python .github/scripts/agent_daemon_verify.py --dist dist/agent-daemon --target '${{ matrix.target }}'
      - uses: actions/upload-artifact@v6
        with:
          name: agent-daemon-${{ matrix.target }}
          path: dist/agent-daemon/*
          if-no-files-found: error

  publish:
    name: Publish GitHub Release
    needs: build
    if: >-
      always() && !cancelled() &&
      (startsWith(github.ref, 'refs/tags/agent-daemon-v') ||
       (github.event_name == 'workflow_dispatch' && inputs.publish)) &&
      (needs.build.result == 'success' ||
       (needs.build.result == 'failure' && github.event_name == 'workflow_dispatch' && inputs.allow_missing))
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v6
        with:
          pattern: agent-daemon-*
          path: dist/agent-daemon
          merge-multiple: true
      - name: Assemble release payloads
        id: assemble
        run: |
          set -euo pipefail
          args=(--dist dist/agent-daemon --output dist/release
                --repo-url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" --commit "$GITHUB_SHA")
          if [[ "$GITHUB_REF" == refs/tags/agent-daemon-v* ]]; then args+=(--tag "$GITHUB_REF_NAME"); fi
          if [[ '${{ github.event_name == 'workflow_dispatch' && inputs.allow_missing }}' == 'true' ]]; then args+=(--allow-missing); fi
          python3 .github/scripts/agent_daemon_release.py "${args[@]}"
      - name: Publish versioned release ${{ steps.assemble.outputs.tag }}
        env:
          TAG: ${{ steps.assemble.outputs.tag }}
          VERSION: ${{ steps.assemble.outputs.version }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" --json assets --jq '.assets | length' > "$RUNNER_TEMP/assets" 2>/dev/null; then
            if [[ "$(cat "$RUNNER_TEMP/assets")" != "0" ]]; then
              echo "::error::release $TAG already has assets; bump src/VERSION instead of republishing" >&2
              exit 1
            fi
            gh release upload "$TAG" dist/release/versioned/assets/*
            gh release edit "$TAG" --title "BuckyOS Agent Daemon $VERSION" --notes-file dist/release/versioned/notes.md --latest=false
          else
            gh release create "$TAG" --target "$GITHUB_SHA" --title "BuckyOS Agent Daemon $VERSION" \
              --notes-file dist/release/versioned/notes.md --latest=false dist/release/versioned/assets/*
          fi
      - name: Refresh rolling release ${{ steps.assemble.outputs.latest_tag }}
        env:
          LATEST: ${{ steps.assemble.outputs.latest_tag }}
          VERSION: ${{ steps.assemble.outputs.version }}
        run: |
          set -euo pipefail
          # Move the rolling tag first so the release page shows the published commit.
          git push --force origin "$GITHUB_SHA:refs/tags/$LATEST"
          if gh release view "$LATEST" > /dev/null 2>&1; then
            gh release upload "$LATEST" --clobber dist/release/latest/assets/*
            gh release edit "$LATEST" --title "BuckyOS Agent Daemon (latest: $VERSION)" \
              --notes-file dist/release/latest/notes.md --prerelease --latest=false
          else
            gh release create "$LATEST" --title "BuckyOS Agent Daemon (latest: $VERSION)" \
              --notes-file dist/release/latest/notes.md --prerelease --latest=false dist/release/latest/assets/*
          fi
      - name: Summary
        env:
          TAG: ${{ steps.assemble.outputs.tag }}
          LATEST: ${{ steps.assemble.outputs.latest_tag }}
        run: |
          {
            echo "## Published"
            echo "- $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/releases/tag/$TAG"
            echo "- $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/releases/tag/$LATEST"
            echo
            echo '```'
            cat dist/release/latest/assets/SHA256SUMS
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
