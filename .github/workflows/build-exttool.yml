name: Build and Publish ExtTool Images

on:
  workflow_call:
    secrets:
      DOCKERHUB_USERNAME:
        required: true
      DOCKERHUB_TOKEN:
        required: true
      R2_ACCESS_KEY_ID:
        required: false
      R2_SECRET_ACCESS_KEY:
        required: false

permissions:
  contents: read

concurrency:
  group: publish-exttool
  cancel-in-progress: false

jobs:
  build:
    name: ExtTool amd64 and aarch64
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.context.outputs.version }}
      revision: ${{ steps.context.outputs.revision }}
      created: ${{ steps.context.outputs.created }}
      immutable_tag: ${{ steps.context.outputs.immutable_tag }}
      amd64_digest: ${{ steps.amd64.outputs.digest }}
      aarch64_digest: ${{ steps.aarch64.outputs.digest }}
    steps:
    - name: Checkout
      uses: actions/checkout@v6
    - name: Login to Docker Hub
      uses: docker/login-action@v4
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}
    - name: Setup ARM64 emulation
      uses: docker/setup-qemu-action@v4
      with:
        platforms: arm64
    - name: Setup Docker Buildx
      id: buildx
      uses: docker/setup-buildx-action@v4
    - name: Prepare ExtTool Docker contexts
      id: context
      env:
        EXTTOOL_CONTEXT_DIR: ${{ runner.temp }}/exttool-context
      run: |
        set -euo pipefail
        bash ./build_exttool --prepare-context "$EXTTOOL_CONTEXT_DIR" --image paios/exttool
        cat "$EXTTOOL_CONTEXT_DIR/metadata.env" >> "$GITHUB_OUTPUT"
        grep -Eq '^immutable_tag=.+' "$EXTTOOL_CONTEXT_DIR/metadata.env" || { echo "ExtTool build needs a clean checkout" >&2; exit 1; }
    - name: Build and push ExtTool amd64
      id: amd64
      uses: docker/build-push-action@v7
      with:
        builder: ${{ steps.buildx.outputs.name }}
        context: ${{ runner.temp }}/exttool-context/amd64
        platforms: linux/amd64
        push: true
        provenance: false
        sbom: false
        tags: |
          paios/exttool:${{ steps.context.outputs.immutable_tag }}-amd64
          paios/exttool:${{ steps.context.outputs.version }}-amd64
          paios/exttool:latest-amd64
        build-args: |
          TARGET_ARCH=amd64
          FREECAD_APPIMAGE_URL=${{ steps.context.outputs.amd64_freecad_url }}
          IMAGE_VERSION=${{ steps.context.outputs.version }}
          SOURCE_REVISION=${{ steps.context.outputs.revision }}
          BUILD_CREATED=${{ steps.context.outputs.created }}
    - name: Build and push ExtTool aarch64
      id: aarch64
      uses: docker/build-push-action@v7
      with:
        builder: ${{ steps.buildx.outputs.name }}
        context: ${{ runner.temp }}/exttool-context/aarch64
        platforms: linux/arm64
        push: true
        provenance: false
        sbom: false
        tags: |
          paios/exttool:${{ steps.context.outputs.immutable_tag }}-aarch64
          paios/exttool:${{ steps.context.outputs.version }}-aarch64
          paios/exttool:latest-aarch64
        build-args: |
          TARGET_ARCH=aarch64
          FREECAD_APPIMAGE_URL=${{ steps.context.outputs.aarch64_freecad_url }}
          IMAGE_VERSION=${{ steps.context.outputs.version }}
          SOURCE_REVISION=${{ steps.context.outputs.revision }}
          BUILD_CREATED=${{ steps.context.outputs.created }}
    - name: Publish ExtTool multi-arch manifests
      env:
        VERSION: ${{ steps.context.outputs.version }}
        AMD64_DIGEST: ${{ steps.amd64.outputs.digest }}
        AARCH64_DIGEST: ${{ steps.aarch64.outputs.digest }}
      run: |
        set -euo pipefail
        docker buildx imagetools create \
          --tag "paios/exttool:$VERSION" \
          --tag "paios/exttool:latest" \
          "paios/exttool@$AMD64_DIGEST" \
          "paios/exttool@$AARCH64_DIGEST"
  export:
    name: ExtTool release tarballs
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
    - name: Checkout
      uses: actions/checkout@v6
    - name: Login to Docker Hub
      uses: docker/login-action@v4
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}
    - name: Export ExtTool tarballs to R2
      env:
        R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
        R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        PAIOS_WRITE_POINTER: ${{ github.ref == 'refs/heads/main' && github.repository == 'buckyos/buckyos' && '1' || '0' }}
        VERSION: ${{ needs.build.outputs.version }}
        REVISION: ${{ needs.build.outputs.revision }}
        CREATED: ${{ needs.build.outputs.created }}
        IMMUTABLE_TAG: ${{ needs.build.outputs.immutable_tag }}
        AMD64_DIGEST: ${{ needs.build.outputs.amd64_digest }}
        AARCH64_DIGEST: ${{ needs.build.outputs.aarch64_digest }}
      run: |
        set -euo pipefail
        out="$RUNNER_TEMP/paios-image-exttool"
        mkdir -p "$out"
        printf 'version=%s\nrevision=%s\ncreated=%s\nimmutable_tag=%s\n' \
          "$VERSION" "$REVISION" "$CREATED" "$IMMUTABLE_TAG" > "$out/metadata.env"
        bash .github/scripts/paios_image_export.sh exttool paios/exttool "$out/metadata.env" \
          "$AMD64_DIGEST" "$AARCH64_DIGEST" "$out"
    - name: Upload ExtTool manifest fragment
      uses: actions/upload-artifact@v6
      with:
        name: paios-image-exttool
        path: ${{ runner.temp }}/paios-image-exttool/paios-image-exttool.json
        if-no-files-found: error
        retention-days: 30
