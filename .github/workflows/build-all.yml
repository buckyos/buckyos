name: Build All BuckyOS Artifacts

on:
  push:
    branches: ["main"]
  workflow_dispatch:
    inputs:
      enable_tests:
        description: 'Enable cargo tests during build'
        required: false
        type: boolean
        default: false

jobs:
  detect-image-changes:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      aios_changed: ${{ steps.changes.outputs.changed }}
      exttool_changed: ${{ steps.exttool.outputs.changed }}
    steps:
    - name: Checkout
      if: ${{ github.event_name == 'push' }}
      uses: actions/checkout@v6
      with:
        fetch-depth: 0
    - name: Detect AIOS changes
      id: changes
      env:
        EVENT_NAME: ${{ github.event_name }}
        BEFORE: ${{ github.event.before }}
        AFTER: ${{ github.sha }}
      run: |
        set -euo pipefail
        if [[ "$EVENT_NAME" == "workflow_dispatch" ]] || ! git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
          echo "changed=true" >> "$GITHUB_OUTPUT"
          exit 0
        fi

        paths=(
          .github/workflows/build-all.yml
          .github/workflows/build-aios.yml
          build_aios
          publish/aios/
          src/frame/opendan/
          src/frame/agent_tool/
          src/frame/agent_tool_cli_dev/
          src/frame/agent-did-object-lib/
          src/frame/llm_context/
          src/frame/lib_opendan/
          src/kernel/buckyos-api/
          src/tools/buckyos-agent/
          src/patches/
          src/Cargo.toml
          src/Cargo.lock
          src/VERSION
          src/bucky_project.yaml
        )
        if git diff --quiet "$BEFORE" "$AFTER" -- "${paths[@]}"; then
          echo "changed=false" >> "$GITHUB_OUTPUT"
        else
          status=$?
          if [[ "$status" -ne 1 ]]; then
            exit "$status"
          fi
          echo "changed=true" >> "$GITHUB_OUTPUT"
        fi
    - name: Detect ExtTool changes
      id: exttool
      env:
        EVENT_NAME: ${{ github.event_name }}
        BEFORE: ${{ github.event.before }}
        AFTER: ${{ github.sha }}
      run: |
        set -euo pipefail
        if [[ "$EVENT_NAME" == "workflow_dispatch" ]] || ! git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
          echo "changed=true" >> "$GITHUB_OUTPUT"
          exit 0
        fi

        paths=(
          .github/workflows/build-all.yml
          .github/workflows/build-exttool.yml
          build_exttool
          publish/exttool/
          src/VERSION
        )
        if git diff --quiet "$BEFORE" "$AFTER" -- "${paths[@]}"; then
          echo "changed=false" >> "$GITHUB_OUTPUT"
        else
          status=$?
          if [[ "$status" -ne 1 ]]; then
            exit "$status"
          fi
          echo "changed=true" >> "$GITHUB_OUTPUT"
        fi
  build-aios:
    needs: detect-image-changes
    if: ${{ needs.detect-image-changes.outputs.aios_changed == 'true' }}
    uses: ./.github/workflows/build-aios.yml
    secrets:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
  build-exttool:
    needs: detect-image-changes
    if: ${{ needs.detect-image-changes.outputs.exttool_changed == 'true' }}
    uses: ./.github/workflows/build-exttool.yml
    secrets:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
  build-windows:
    strategy:
      fail-fast: false
      matrix:
        arch: ["x86_64"]
    uses: ./.github/workflows/build-windows.yml
    with:
      arch: ${{ matrix.arch }}
      enable_tests: ${{ github.event_name == 'workflow_dispatch' && inputs.enable_tests }}
  build-linux:
    strategy:
      fail-fast: false
      matrix:
        arch: ["x86_64", "aarch64"]
    uses: ./.github/workflows/build-linux.yml
    with:
      arch: ${{ matrix.arch }}
      enable_tests: ${{ github.event_name == 'workflow_dispatch' && inputs.enable_tests }}
  build-macos:
    strategy:
      fail-fast: false
      matrix:
        arch: ["x86_64", "aarch64"]
    uses: ./.github/workflows/build-macos.yml
    with:
      arch: ${{ matrix.arch }}
      enable_tests: ${{ github.event_name == 'workflow_dispatch' && inputs.enable_tests }}

  upload-payloads:
    name: Upload component payloads to R2
    needs: [build-windows, build-linux, build-macos]
    if: github.ref == 'refs/heads/main' && github.repository == 'buckyos/buckyos'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      actions: read
    concurrency:
      group: payload-r2-${{ github.repository }}
      cancel-in-progress: false
    steps:
      - name: Download component payloads
        uses: actions/download-artifact@v6
        with:
          pattern: buckyos-*
          merge-multiple: true
          path: ${{ runner.temp }}/payloads
      - name: Upload component payloads to R2
        uses: ryand56/r2-upload-action@latest
        with:
          r2-account-id: 87e0bdf811b13ee87fd0bcec7a4fd1e7
          r2-access-key-id: ${{ secrets.R2_ACCESS_KEY_ID }}
          r2-secret-access-key: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          r2-bucket: buckyos-installer
          source-dir: ${{ runner.temp }}/payloads
          destination-dir: buckyos/
          keep-file-fresh: false
          output-file-url: false
