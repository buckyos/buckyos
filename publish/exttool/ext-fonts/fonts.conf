<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<!-- ext-core takes this file in from <tools>/store/ext-fonts. fontconfig resolves a relative directory from where this
     file really is, <tools>/versions/ext-fonts/<dir>/store/ext-fonts: each is the static TrueType directory of an online
     item in <tools>/online. One that is not downloaded is not there and counts for nothing. -->
<fontconfig>
  <dir prefix="relative">../../../../../online/noto-sans-thai/NotoSansThai/full/ttf</dir>
  <dir prefix="relative">../../../../../online/noto-serif-thai/NotoSerifThai/full/ttf</dir>
  <dir prefix="relative">../../../../../online/noto-sans-devanagari/NotoSansDevanagari/full/ttf</dir>
  <dir prefix="relative">../../../../../online/noto-serif-devanagari/NotoSerifDevanagari/full/ttf</dir>
  <dir prefix="relative">../../../../../online/inter/extras/ttf</dir>
  <dir prefix="relative">../../../../../online/source-sans-3/TTF</dir>
  <dir prefix="relative">../../../../../online/source-serif-4/source-serif-4.005_Desktop/TTF</dir>
  <dir prefix="relative">../../../../../online/jetbrains-mono/fonts/ttf</dir>
</fontconfig>
