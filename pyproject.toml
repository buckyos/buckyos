[project]
name = "buckyos-workspace"
version = "0.1.0"
description = "Workspace runtime dependencies for BuckyOS development scripts."
requires-python = ">=3.12"
dependencies = [
    "buckyos-devkit",
]

[tool.uv.sources]
# Local sibling checkout so devkit fixes (e.g. `devtest run` env_params) take
# effect without waiting for a git release; switch back to the git source once
# the fix is pushed upstream.
buckyos-devkit = { path = "../buckyos-devkit", editable = true }
