[package]
name = "aiworkspace"
version.workspace = true
edition = "2021"

[lib]
name = "aiworkspace_server"
path = "src/lib.rs"

[[bin]]
name = "aiworkspace"
path = "src/main.rs"

[dependencies]
aiworkspace-core = { path = "../core" }
aiworkspace-store = { path = "../store" }
tokio = { workspace = true }
axum = { workspace = true }
futures-util = { workspace = true }
async-trait = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
clap = { workspace = true }
log = { workspace = true }
env_logger = { workspace = true }
http = { workspace = true }
bytes = { workspace = true }
buckyos-kit = { workspace = true }
buckyos-api = { path = "../../../kernel/buckyos-api" }

[dev-dependencies]
tempfile = { workspace = true }
reqwest = { workspace = true }
base64 = { workspace = true }
loro = "1.16"
