[package]
name = "aiworkspace"
version.workspace = true
edition = "2021"

[lib]
name = "aiworkspace_server"
path = "src/lib.rs"

[[bin]]
name = "aiworkspace"
path = "src/main.rs"

[dependencies]
aiworkspace-core = { path = "../core" }
aiworkspace-store = { path = "../store" }
tokio = { workspace = true }
axum = { workspace = true }
futures-util = { workspace = true }
async-trait = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
clap = { workspace = true }
log = { workspace = true }
env_logger = { workspace = true }
http = { workspace = true }
bytes = { workspace = true }
http-body-util = { workspace = true }
buckyos-http-server = { workspace = true }
name-lib = { workspace = true }
buckyos-kit = { workspace = true }
buckyos-api = { path = "../../../kernel/buckyos-api" }
agent_tool = { path = "../../agent_tool" }
llm_context = { path = "../../llm_context" }
named_store = { workspace = true }
ndn-lib = { workspace = true }
kRPC = { workspace = true }
reqwest = { workspace = true }
percent-encoding = { workspace = true }
url = { workspace = true }
base64 = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
loro = "1.16"
nfs_server = { path = "../../nfs_server" }
zip = { workspace = true }
flate2 = { workspace = true }
tar = { workspace = true }
