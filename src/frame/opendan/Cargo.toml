[package]
license-file.workspace = true
license.workspace = true
name = "opendan"
version.workspace = true
edition = "2021"
authors = ["BuckyOS DAO"]
description = "OpenDAN: the Agent Loader — hosts the sessions of one agent and serves its Agent State"

[dependencies]
async-trait = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
toml = { workspace = true }
tokio = { workspace = true }
log = { workspace = true }
anyhow = { workspace = true }
sha2 = { workspace = true }
hex = { workspace = true }
base64 = { workspace = true }
url = { workspace = true }
percent-encoding = { workspace = true }
reqwest = { workspace = true }
bytes = { workspace = true }
http = { workspace = true }
http-body-util = { workspace = true }
hyper = "1.8.1"
hyper-util = { version = "0.1", features = ["tokio"] }
tokio-tungstenite = { workspace = true }
futures = { workspace = true }
kRPC = { workspace = true }
name-lib = { workspace = true }
ndn-lib = { workspace = true }
ndn-toolkit = { workspace = true }
buckyos-kit = { workspace = true }
buckyos-http-server = { workspace = true }
buckyos-api = { path = "../../kernel/buckyos-api" }
llm_context = { path = "../llm_context" }
agent_tool = { path = "../agent_tool" }
agent_tool_cli_dev = { path = "../agent_tool_cli_dev" }
agent-did-object-lib = { path = "../agent-did-object-lib" }
libopendan = { path = "../lib_opendan" }
image = { version = "0.25.5", default-features = false, features = ["jpeg"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2.177"

[dev-dependencies]
tempfile = { workspace = true }
axum = { workspace = true }
named_store = { workspace = true }
nfs_server = { path = "../nfs_server" }
