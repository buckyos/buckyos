<!DOCTYPE html><html lang="ja"><head><meta charset="utf-8"><title>反撃能力に新たな対艦ミサイル　有事視野、装備の国産化推進（共同通信）のコメント一覧 - Yahoo!ニュース</title></head><body>
<script>window.__PRELOADED_STATE__ = {"commentFull":{"commentGetStatus":"success","userCommentList":[{"text":"どうせ防衛力を強化するために巨額の予算を使うのであれば、国産化を進める方向は賛成です。アメリカから高額な兵器を購入し続けるだけでは、相手国の都合や輸出制限に左右されるリスクもあります。\n有事の際に必要な装備を必要な数だけ確保できるかは、国の安全保障に直結します。部品や弾薬まで国内で生産できる体制を整えることには大きな意味があります。\n防衛費を増やすだけでなく、国内企業の技術力や生産基盤を育て、将来的には海外依存を減らしていく政策に期待したいです。","name":"海波","commentId":"99dcc13a-2539-4f35-8ab8-8e880e0b5384","postDate":"2時間前","empathyCount":310,"isVisible":true},{"text":"あと数年で人員や人材が不足することが想定されているのだから、いつから運用できてその効果がどの程度見込めるかわからない1艘1兆円もする原子力潜水艦なんかを導入するよりも、インテリジェンス部門はAIを、前線や保管はロボットを、前線や兵站は無人機を、あらゆるシーンに対応するドローン等を、その他にもロシアが計画しているという宇宙空間の独占支配や中国の月の開発占有等に対抗するような対策を早急に進めるべきで、そのための予算をしっかり確保していくべきと考えます。","name":"m_s********","commentId":"987bee74-b86d-4629-88e8-b0446241a46e","postDate":"46分前","empathyCount":14,"isVisible":true},{"text":"日本に必要なのは武器の国産化であり、軍事産業を活性化させ、友好国に輸出し利益を確保できる産業構造の確立である。\n防衛費は武器だけではなく、輸送ルートの整備等も含まれており、過疎化する地方の輸送ルートも国防の一環である。\nどの道、防衛費の増額は避けられない課題であり、費用をかけるなら国が潤う選択が必要であり、アメリカ依存は減らす方向に舵を切ってほしい。","name":"よーちゃんの独り言","commentId":"e00198a7-81ed-4c48-ac42-c3bcca3a3013","postDate":"2時間前","empathyCount":121,"isVisible":true},{"text":"今後の政策的な取り組みの中で、高市政権の優先順位は、成長戦略17分野への重点投資が最優先課題だろう。\n 将来の税収・賃金・供給力を生み、財政の持続性にも繋がる為だ。\n その次が防衛費の拡大予算ではないか。米国側からの増額要求と我が国の安全保障上の装備不足分は埋めなければならない。\n優先順位の最後は消費税の恒久的な減税予算の確保だろう。家計支援の効果はあるが、恒久的な歳入減となり、成長投資や社会保障の財源を圧迫する為、舵取りはかなり高度な内容だろう。","name":"ter","commentId":"f4b2f339-e273-4808-8600-6d0a46da56eb","postDate":"1時間前","empathyCount":23,"isVisible":true},{"text":"国産化には賛成です。ただ、兵器は開発して終わりではありません。部品や半導体、推進薬、整備まで国内で回せなければ、有事に肝心のミサイルが足りないという事態になりかねません。\n\nもう一つ重要なのは、予算を削りながら国産化を進められるのかという点です。防衛産業は設備投資も技術者の育成も時間がかかります。発注数が少なく、数年先の需要すら読めないのであれば、民間企業が本気で投資できるはずもありません。\n\n米国依存を減らすというのは、単に外国製を買わなくなることではない。自国で必要なものを必要な時に作り続けられることです。国産化を本気で掲げるなら、まず政府自身が長期的な需要を保証する覚悟を示すべきでしょう。","name":"Tバックが乾くまで","commentId":"351ae135-aed0-4653-b0b0-cc4ade4a45c7","postDate":"2時間前","empathyCount":70,"isVisible":true},{"text":"有事の緊急増産を視野に装備品の国産化を推進すると言いながら、国内の防衛関連企業には最大8割減の予算枠を提示する。\n\nこれほど矛盾した安全保障政策があるだろうか。有事になってから工場を建て、熟練技術者を育成することなどできない。平時から生産基盤を維持することこそ、安全保障の基本である。政府の要請に応じて設備投資を進めた企業の信頼を損なえば、将来の国防にも禍根を残す。\n\n問題は防衛費の多寡ではなく、政策の整合性と実現可能性を担保できない高市政権の統治能力にある。勇ましい安全保障政策を掲げながら、その実現を支える産業基盤を自ら危うくするのであれば、本末転倒も甚だしい。\n\n国家安全保障の根幹に関わる政策でこれほどの混乱を招いた高市氏に、果たして首相としての適格性があるのか。国会は問責決議案の提出も視野に、その政治的責任を厳しく追及すべきである。","name":"T2phase","commentId":"763bb1b6-aa17-4813-b751-dbbcca1c0891","postDate":"1時間前","empathyCount":44,"isVisible":true},{"text":"防衛力強化も国産化も賛成ですが、強化の方向性に疑問があります。\n\nロシア対ウクライナではドローン等を軸に安価な装備を大量投入し、省人化を進めています。\n\n原潜や対艦ミサイルは強力ですが高額でこれからの戦争を考えたら費用対効果が悪いのではないかと思います。より高性能でかつ安価な攻撃ドローンや迎撃ドローンの開発を目指すべきだと思います。\n\nAIが更に進めば、ドローンやロボット等をAIが制御して自動で戦うと思います。\n\n陸海空で安価、無人、大量生産を軸にするほうが合理的な気がします。","name":"czd********","commentId":"a82acb7f-e459-4808-a13b-704e9df606fc","postDate":"2時間前","empathyCount":49,"isVisible":true},{"text":"防衛はどの程度かければ安全が保てるのか、安心できるのか。核や無謀な攻撃は許される事ではなく、許さない機運を作る事の方が、より安心を保てる気がしてなりません。それより、プラネタリーバウンダリーなどの対策、世界と連携して力を合わせないと対処しきれなくなってきている問題に力を入れる事、世界が共有する問題に認識を取りまとめて一丸となって取り組む方が平和に近づくのではないのでしょうか。","name":"mar********","commentId":"de8ee680-55c4-4774-aeb2-a46ded479547","postDate":"4分前","empathyCount":0,"isVisible":true},{"text":"電磁波攻撃兵器の開発、増設も必要ではないか。これは強力な電磁波や電磁パルス（EMP）を発生させて、敵の電子機器やレーダー、通信網、ドローンなどを誤作動・機能停止・破壊する兵器の総称です。物理的な弾丸や爆発で直接破壊するのではなく、電子回路に過電圧や障害を与える点が特徴です。相手のミサイルを誤爆、誤作動させるのにも有効だ。","name":"phj********","commentId":"6015d084-057f-4b35-9974-30d70d4801e5","postDate":"2時間前","empathyCount":19,"isVisible":true},{"text":"減税や積極財政で日本円の価値を毀損してたら、円安によって安い日本になってしまいます。\n海外の高性能武器を買うために必要な金額はどんどん上がっていきますし、逆に海外からしたら日本の土地や企業は安くて買い叩きやすい国ということになってしまいます。\n\n本気で安全保障を考えるなら、まずはポピュリズム減税や積極財政などをやめることで円安を防ぎ、円の価値を担保すること。\n貨幣の価値を担保して、経済を強く保っていかないと、安全保障にまで悪影響を与えてしまいます。\nポピュリズムに抗ってそれができる政治家が、本当の愛国者ということだと思いますが、そんな気概のある政治家はほとんどいないようです。","name":"shin","commentId":"289d6227-0229-41df-bbf1-839dd7464671","postDate":"2時間前","empathyCount":35,"isVisible":true}]}}</script>
