<script>window.__PRELOADED_STATE__ = {"commentFull":{"commentGetStatus":"success","userCommentList":[{"text":"普通に仕事をしていた70歳の男性が、突然刃物で襲われ命を落とす。こんな事件が身近な場所で起きること自体、恐ろしいです。駐輪場は誰もが日常的に利用する場所で、特別に危険な環境でもありません。\n犯人が確保されたとしても、事件の全容が分かったわけではありません。なぜ被害者が狙われたのか、面識はあったのか、犯行に至るまでに何があったのか。動機を含めて徹底的に調べてほしいです。\n理由が何であれ、他人の命を奪う権利などありません。被害者とご遺族の無念を思うと、本当にやりきれません。","name":"海波","commentId":"e5509842-cf0f-4030-867b-749edfd04bff","postDate":"5時間前","empathyCount":5553,"isVisible":true},{"text":"福岡市西区は市の西端に位置し、玄界灘や能古島、玄界島などの島々を抱える自然豊かな地域です。九州大学伊都キャンパスや九大学研都市駅周辺では、新しい住宅地や商業施設が整備されています。東区は市の東部にあり、香椎・千早、箱崎などの市街地に加え、志賀島や香椎宮など歴史的・文化的な名所もあります。早良区は、北部のシーサイドももちや西新の都市的な地域から、南部の脊振山系まで広がる、自然と都市が調和した区です。西新駅は福岡市地下鉄空港線の駅で、西新地区の商業・文教・交通の拠点となっています。一方、「一逮捕一勾留の原則」とは、同一の事件について、逮捕と勾留を繰り返して身柄拘束を長引かせることを防ぐ考え方です。勾留には裁判官の判断が必要で、期間や延長にも法律上の制限があります。駅員への暴行容疑で逮捕したから、駐輪場の事件について取調べできないということだろうか。それにしても、物騒やな。","name":"フワちゃん！　フワちゃん！　フワちゃん！","commentId":"e9944656-980b-4066-aa11-fcdc476c839f","postDate":"2時間前","empathyCount":38,"isVisible":true},{"text":"ほんと、多いな。こんな殺人事件が。凶悪犯罪に対する日本の刑罰や裁判制度が甘いからだと思う。殺された人と同じような苦しみをきちんと受けさせるべき。殺す気が無かったなんて言う訳の分からない言い訳は無視！そうしないと今後も軽々しく殺人事件が行われると思う。","name":"his********","commentId":"7eb95519-4e44-4164-8472-9cd8ae07d4ce","postDate":"4時間前","empathyCount":3516,"isVisible":true},{"text":"自分が最初に見た番組では、被害者が50代と言っていたので、50代でイオンでカート回収？または他の仕事？警備員？なんて思っていたが、70代という事でしたか。\n容疑者とどの様な関係や絡みがあったかわかりませんが、70代になっても一生懸命に働かれてきて、最後がこの様な形で亡くなってしまうのはとても悔しくてやりきれないでしょう。\nご冥福をお祈りいたします。","name":"mas********","commentId":"178b66df-a874-45d3-89e8-7d8aecbae294","postDate":"3時間前","empathyCount":491,"isVisible":true},{"text":"記事を読ませて頂きましたが､亡くなられた男性に恨みがあったのか､自分自身に不満があったのか､世の中に対して不満があったのか分からないですが、人を殺すって言ったら相当な力を加えて刺したはずですね、亡くなられた男性は仕事中に突然刺されて､突然亡くなるんだもんな､亡くなられた男性には家族がいるのかな？居たとしたら泣くに泣けないでしょうね、詳細は､これから取り調べで分かってくることだとは思いますが、謎の部分も多い事件ですね､亡くなられた男性のご冥福をお祈りします。","name":"pfg********","commentId":"1de3a075-6b23-48e9-bc30-5f896cd622bd","postDate":"4時間前","empathyCount":1577,"isVisible":true},{"text":"人間にも保安装置が必要です。列車には保安装置が搭載され、赤信号を無視しようとしても自動的にブレーキがかかります。それと同じように、犯罪を起こそうとするとそれを自動的に止めるシステム。ブレインマシンインターフェイスの技術を進歩させて、早く実現させたいです。","name":"shi********","commentId":"1d6e8619-639e-447a-a360-187403edb068","postDate":"3時間前","empathyCount":18,"isVisible":true},{"text":"怨恨か突発的な通り魔かはこれからの捜査で明らかになることですが、側のイオンモールに入って上着を変えて逃走する程度の小賢しさがあることがわかっているので、責任能力は十分にあったことは明らかです。\n人の命を奪った罪の重さを容疑者にきちんと背負わせることになることを司法に期待します。","name":"tai********","commentId":"16e2d54a-a207-43a9-992e-114fcf0191a1","postDate":"4時間前","empathyCount":1075,"isVisible":true},{"text":"ニュースによると、事件の後か先か分からないけど、携帯電話を線路に落とし、緊急停止ボタンを押し、駅員に取れと命令し、今は出来ない旨を伝えたら駅員を殴って逃げたと報じていた。こんな人間は一生刑務所で過ごしてください。こんなのが街中を歩いていたらまた同じようなことが起こるであろう。自分の身勝手で人に手をかけたなら、自分の命で償うべきだが。","name":"men********","commentId":"b44b4901-476a-4ea4-89e5-68f47726997d","postDate":"2時間前","empathyCount":247,"isVisible":true},{"text":"殺人事件が本当に多くなり不安です。見かけだけでは判断は難しいし、命を守る事が難しいです。理由は何であれ命を理不尽に奪う事は許されない出来れば同じ苦しみをと願うのが本音です。強盗殺人、ストーカー殺人、ひき逃げ、飲酒運転で死亡事故から我が子の命を奪う事まで様々だか夫婦の命を奪い放火までし被告は高齢者でありながら死刑判決になった事件がありましたが死刑判決が出ても遺族は納得出来るものではない。日本も毎日のように悲惨な事件が次から次と報道されるのを見ると憤りを感じる。","name":"ejc********","commentId":"e6a7d73e-cb78-47b0-bd73-2d18696a3c3a","postDate":"4時間前","empathyCount":541,"isVisible":true},{"text":"最初の駅員に対する暴行事件も110番手配されていたのかそして2件目の本件は昼、職質は夕方、職質したのは私服なのか制服警察官なのかはわかりませんがかなり時間経過していても愚直に警戒していたのですね。","name":"okn********","commentId":"be4ea484-fcff-40df-a132-0f7a99a2c17c","postDate":"3時間前","empathyCount":28,"isVisible":true}]}}</script>
