<script>window.__PRELOADED_STATE__ = {"articleDetail":{"contentId":"59f89b9e37638a7771f73cc2e307dc31bd432736","articleId":"20261125-00000133-asahi-soci","amandaId":"20261125-00000133-asahi","newsType":"textnews","media":{"mediaId":"asahi","mediaName":"朝日新聞","mediaUrl":"https://www.asahi.com/?ref=yahoo","bannerUri":"https://s.yimg.jp/images/news-cpm/logo/image1/asahi.png","copyright":"朝日新聞社","ngOgpImage":false,"ngSocialModule":false,"lineAmAccountUrl":"https://line.me/R/ti/p/%40oa-asahishimbun?oat_source=yahoo_news&oat_medium=article&oat_page=detail"},"category":"domestic","categoryShortName":"dom","hasVideo":false,"subCategory":"soci","headline":"駅の駐輪場で男性刺殺、関与した疑いのある男の身柄を確保　福岡県警","headlineInTagList":[{"type":"text","text":"駅の駐輪場で男性刺殺、関与した疑いのある男の身柄を確保　福岡県警","titleLink":null}],"newsLink":"https://news.yahoo.co.jp/articles/59f89b9e37638a7771f73cc2e307dc31bd432736","paragraphs":[{"objectItems":[{"caption":"男性が刺されたとみられる現場付近には規制線が張られていた=2026年11月25日午後2時1分、福岡市西区、浦上慧伍撮影","credit":"朝日新聞","position":"left","alt":"駅の駐輪場で男性刺殺、関与した疑いのある男の身柄を確保　福岡県警","thumb":{"width":640,"height":426,"uri":"https://newsatcl-pctr.c.yimg.jp/t/amd-img/20261125-00000133-asahi-000-15-view.jpg?exp=10800"},"resizedThumbUrl":{"webp":"https://newsatcl-pctr.c.yimg.jp/t/amd-img/20261125-00000133-asahi-000-15-view.jpg?exp=10800&fmt=webp","jpeg":"https://newsatcl-pctr.c.yimg.jp/t/amd-img/20261125-00000133-asahi-000-15-view.jpg?exp=10800"},"resizedViewUrl":{"webp":"https://newsatcl-pctr.c.yimg.jp/t/amd-img/20261125-00000133-asahi-000-15-view.jpg?exp=10800&fmt=webp","jpeg":"https://newsatcl-pctr.c.yimg.jp/t/amd-img/20261125-00000133-asahi-000-15-view.jpg?exp=10800"},"photoDetailUrl":"https://news.yahoo.co.jp/articles/59f89b9e37638a7771f73cc2e307dc31bd432736/images/000","hasVideo":false}],"textDetails":[{"paragraphItems":[{"type":"text","text":"　福岡市西区の駐輪場で25日昼、勤務していた男性が刺されて死亡した事件で、福岡県警が、事件に関与した疑いのある男の身柄を確保したことが、捜査関係者への取材でわかった。\n\n","link":null}],"text":"　福岡市西区の駐輪場で25日昼、勤務していた男性が刺されて死亡した事件で、福岡県警が、事件に関与した疑いのある男の身柄を確保したことが、捜査関係者への取材でわかった。\n\n　県警によると、男は福岡市東区の職業不詳、川谷典雄容疑者（49）。\n\n　この事件の50分ほど前に福岡市早良区の福岡市地下鉄西新駅の構内で、男性駅員（33）を殴ったとして、暴行容疑で25日夜に逮捕した。西区の殺人容疑についても関与した疑いがあるとみて調べる。\n\n　川谷容疑者は暴行事件については容疑を認めているといい、殺人についてはまだ取り調べをしていないと県警は説明している。\n\n　捜査関係者によると、25日午後3時過ぎ、現場から逃走した男と服装や容姿がよく似た川谷容疑者を、警察官が福岡市東区で見つけた。職務質問し、身柄を確保した。\n\n　事件は25日午後0時半ごろに発覚した。西区北原1丁目のJR筑肥線・九大学研都市駅の西側駐輪場で、「人が刺されている」と目撃者から110番通報があった。\n\n　刺された男性は搬送先の病院で死亡。県警は、亡くなったのは近くに住む石川嘉章さん（70）と確認した。この駐輪場で勤務中だったという。\n\n　現場からは容疑者とみられる男が逃走し、現場の目の前にある商業施設「イオンモール福岡伊都」を通り抜けた後、行方がわからなくなっていた。\n\n■駅員への暴行認める\n\n　一方、この事件よりも前の午前11時40分ごろ、西新駅で川谷容疑者が線路内にスマートフォンを落とし、駅構内の緊急ボタンを押した。\n\n　線路内に入ってスマホを取ろうとした際、駆けつけた駅員に制止され、駅員を殴った疑いがある。「駅員さんに暴行したことは間違いありません」と供述しているという。","link":{"linkText":"【写真多数】「逃げた男が店内に」白昼のイオン、客ら避難し騒然","linkURL":"https://www.asahi.com/articles/photo/AS20261125003713.html?oai=ASVCT3PSBVCTTIPE01GM&ref=yahoo_kijinaka"}},{"paragraphItems":[{"type":"text","text":"\n\n　県警によると、男は福岡市東区の職業不詳、川谷典雄容疑者（49）。\n\n　この事件の50分ほど前に福岡市早良区の福岡市地下鉄西新駅の構内で、男性駅員（33）を殴ったとして、暴行容疑で25日夜に逮捕した。西区の殺人容疑についても関与した疑いがあるとみて調べる。\n\n　川谷容疑者は暴行事件については容疑を認めているといい、殺人についてはまだ取り調べをしていないと県警は説明している。\n\n　捜査関係者によると、25日午後3時過ぎ、現場から逃走した男と服装や容姿がよく似た川谷容疑者を、警察官が福岡市東区で見つけた。職務質問し、身柄を確保した。\n\n　事件は25日午後0時半ごろに発覚した。西区北原1丁目のJR筑肥線・九大学研都市駅の西側駐輪場で、「人が刺されている」と目撃者から110番通報があった。\n\n　刺された男性は搬送先の病院で死亡。県警は、亡くなったのは近くに住む石川嘉章さん（70）と確認した。この駐輪場で勤務中だったという。\n\n　現場からは容疑者とみられる男が逃走し、現場の目の前にある商業施設「イオンモール福岡伊都」を通り抜けた後、行方がわからなくなっていた。\n\n■駅員への暴行認める\n\n　一方、この事件よりも前の午前11時40分ごろ、西新駅で川谷容疑者が線路内にスマートフォンを落とし、駅構内の緊急ボタンを押した。\n\n　線路内に入ってスマホを取ろうとした際、駆けつけた駅員に制止され、駅員を殴った疑いがある。「駅員さんに暴行したことは間違いありません」と供述しているという。","link":null}],"text":"　福岡市西区の駐輪場で25日昼、勤務していた男性が刺されて死亡した事件で、福岡県警が、事件に関与した疑いのある男の身柄を確保したことが、捜査関係者への取材でわかった。\n\n　県警によると、男は福岡市東区の職業不詳、川谷典雄容疑者（49）。\n\n　この事件の50分ほど前に福岡市早良区の福岡市地下鉄西新駅の構内で、男性駅員（33）を殴ったとして、暴行容疑で25日夜に逮捕した。西区の殺人容疑についても関与した疑いがあるとみて調べる。\n\n　川谷容疑者は暴行事件については容疑を認めているといい、殺人についてはまだ取り調べをしていないと県警は説明している。\n\n　捜査関係者によると、25日午後3時過ぎ、現場から逃走した男と服装や容姿がよく似た川谷容疑者を、警察官が福岡市東区で見つけた。職務質問し、身柄を確保した。\n\n　事件は25日午後0時半ごろに発覚した。西区北原1丁目のJR筑肥線・九大学研都市駅の西側駐輪場で、「人が
