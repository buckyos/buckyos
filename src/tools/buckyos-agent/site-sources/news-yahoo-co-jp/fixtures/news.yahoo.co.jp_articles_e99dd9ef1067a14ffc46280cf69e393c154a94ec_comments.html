<!DOCTYPE html><html lang="ja"><head><meta charset="utf-8"><title>米、14カ国・地域に新関税案　日本15％・中国20％　過剰生産対抗で（ロイター）のコメント一覧 - Yahoo!ニュース</title></head><body>
<script>window.__PRELOADED_STATE__ = {"commentFull":{"commentGetStatus":"success","userCommentList":[{"text":"高額な関税を課した分、米国内での販売価格が上がるだけだと思いますけどね。\n米国民の反感を買うのではないでしょうか。。\n\n物価高で生活が苦しい人たちも増えていると聞きますし、場合によってはヨーロッパ並みにデモが起こる可能性もあると思います。","name":"ヨーデル・K","commentId":"b309ac2e-e81b-4f33-8fa6-ea6b21e37904","postDate":"1時間前","empathyCount":413,"isVisible":true},{"text":"世界経済がますます保護主義と自由貿易の間で揺れ動いていると感じる。\n自国産業を守るために一定の対策は必要かもしれないが、関税の応酬は最終的に企業や消費者の負担増につながる。\nまた、日本も対象国に含まれていることから、この問題は決して米中だけの話ではない。\n関税率の上限が既存協定の範囲内に抑えられる見通しとはいえ、国際貿易の不確実性が高まることは避けられず、今後の各国の対応と世界経済への影響を注視する必要があるだろう。","name":"rok********","commentId":"f2977648-fb85-49bf-a817-ce9eae9d9556","postDate":"1時間前","empathyCount":167,"isVisible":true},{"text":"経営者として貿易収支でアメリカが赤字の国が許せないという思考。\nアメリカと自分に利益が来ないのなら相手の事は気にしないのが、\n高齢のワンマン社長には良く有るので、残り二年程の任期で思いついた事を\n次々と議会の承認が不要なら実行していくだろう。\nあと二年を同意せずに躱し続けて乗り切る施策を続けた方が良い。","name":"ext********","commentId":"7cd42155-e5ef-42c0-bc1e-9bac1745474b","postDate":"1時間前","empathyCount":185,"isVisible":true},{"text":"トランプ関税は違法である。アメリカは日本に対して貿易赤字を抱えているが、これは日本が不当に利益を得ているのではなく、日本の製品がアメリカより優れているからである。\n関税をかけてもアメリカ国内の産業は活性化しないし、日本企業がアメリカに積極的に投資するとはならない。トランプは任期が2年で、その後は予想ができず、安易にアメリカに進出しようとは思えない。\nトランプが大統領であるうちは、無風で終われるようにただ耐えることが吉である。","name":"よーちゃんの独り言","commentId":"4ac997a3-2fa9-48b7-a78b-ac7c87106b00","postDate":"1時間前","empathyCount":314,"isVisible":true},{"text":"アメリカと商売しなければ良い話になりつつある。まぁ、正しくはトランプ政権のアメリカとはですが。商売の基本は信用。信用のない相手とは取引しないに限る。特に発言に責任を持たずに二転三転させる相手となんかは付き合いきれない。\n折角だし、アメリカ以外に目を向けても良いかもしれませんね。場合によっては、アメリカそっちのけで新たな市場だって産まれるかもしれませんしね。","name":"ada********","commentId":"0ed26e6d-38da-4610-8d86-e97e8f4910d7","postDate":"2分前","empathyCount":0,"isVisible":true},{"text":"自分はインバウンド客相手に接客業をしています。仕事をはじめて1年目はアジア人のお客様特有、文化の違い、マナーの違いに馴染めず、嫌いになりかけた時期もありました。\nただ一緒に働く中国から来た方々、米国から来た方々と話してみて、米国人の日本人、いやアジア人に対する考え方にものすごい違和感を感じ始めています。\n正直米国人はアジア人を下にみています。街中や公共の場で英語を話す事をステータスだと勘違いしているようにみえます。\n今まで自分が心の奥で中国をはじめとするアジア人への苦手感も、実際に一緒に働いて話し合うと米国人のような小馬鹿にした薄っぺらな偽善な付き合いではなく、真剣に人間関係を築いていける方々なのではと思えるようになってきました。\n一次的な感情や国際情勢で中国と仲が悪いのもよくわかりますが、米国人の言いなりになる日本にすごく危険に感じる今日この頃です。","name":"ファミー","commentId":"9611dca2-057b-4c56-a799-a2c01a538f0d","postDate":"32分前","empathyCount":57,"isVisible":true},{"text":"もう時代はアメリカ抜きで貿易をしていかなきゃいけない時代になってるんだな。\nここまでされて、それでも、どうかアメリカ様ーっ、って媚びへつらうのもナンセンスだよな。\nアメリカ離れが世界で起きたら、いや、起きてもトランプは分からないかも知れない。\n日本も同盟国とは言えども微妙に方向転換していくべき。アメリカが同盟国と思い、どんな良い事をしてやっても、時間が経てば手のひらを返す様な仕打ちをしてくる。\n是非とも民主党に期待したい。\n世界を元通りにして欲しい。","name":"bar********","commentId":"f6eb2722-422d-4a27-8f67-440775a95442","postDate":"1時間前","empathyCount":170,"isVisible":true},{"text":"トランプ大統領は、来年1月から民主党が上下両院の主導権を握ることを、どう考えているのでしょうか。\n\n共和党が中間選挙で敗北した背景には、少なくとも次のような政策上の問題があったと考えます。\n\n強制送還を強行したことで、農業分野の労働力不足が深刻化し、作付けや収穫に影響が出たこと。\n\n関税政策によって農産物の輸出先が狭まり、大豆などの販売にも影響が及んだこと。さらに、輸入品の価格上昇を通じて、国民生活のインフレにもつながったこと。\n\nイランとの戦争によって燃料価格が上昇し、農家だけでなく一般国民の生活にも負担が生じたこと。\n\nこうした問題がある中で、トランプ大統領が関税政策を継続すれば、民主党が反発することは十分予想できます。\n\nその結果、議会による政権への追及が強まり、弾劾訴追をめぐる議論に発展する可能性もあるのではないでしょうか。","name":"?","commentId":"3543429c-0838-4b96-9723-da230eb05392","postDate":"1時間前","empathyCount":51,"isVisible":true},{"text":"トランプ新関税で米国株は3～5％の下落気配ですが、私は今回を単なる調整ではなく、1～1年半続く弱気相場の入口と見ています。\n本当の転換点は10～12月期決算です。AI相場を牽引してきたマグニフィセント・セブンは、もはや売上高だけでは評価されません。市場が見ているのは、巨額のAI投資を利益として回収できるかどうかです。\n期待を下回る収益しか示せなければ、株価を支えてきたAIへの期待は急速にしぼむでしょう。本当の世界ショックは関税ではなく、M7のAI投資回収に陰りが見えた時に始まるのではないでしょうか。\n足元で銀行株は好調ですが、金利上昇の恩恵と経済の歪みは紙一重です。景気減速や信用不安が表面化すれば状況は一変しかねません。相場は1年半前の相互関税ショック時の水準へ逆戻りし、日経平均3万1000円、S&P500の5000割れも十分あり得ると見ています。","name":"ベッツスタイル","commentId":"325d6dcc-40d8-4fbc-8524-9b2eb8e3a2ff","postDate":"58分前","empathyCount":18,"isVisible":true},{"text":"先週の米中露首脳会談で「平和宣言」だの「歴史的対話」だのと友好ムードを演出していたのは一体何だったのか甚だ疑問に思います。\n帰国した途端にこの新関税発表では、結局のところ国内向けの点数稼ぎとメディア映えを狙った、その場限りの茶番劇だったとしか思えません。\n笑顔で握手しながらテーブルの下では殴り合う準備をしていたわけですね。\nしかも中国だけでなく同盟国の日本までしっかり巻き添えにしているあたり、トランプ氏のディール外交のしたたかさと冷酷さがよく表れています。\n大国のトップ同士のパフォーマンスに振り回される国の身にもなってほしいものです。","name":"kch********","commentId":"0d8704a3-f05b-4a9c-a651-1cff3695f244","postDate":"1時間前","empathyCount":72,"isVisible":true}]}}</script>
