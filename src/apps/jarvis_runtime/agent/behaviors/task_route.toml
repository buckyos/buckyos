[meta]
name = "task_route"
objective = "Decide whether a request needs a work session and create it."

[prompt]
mode = "function_call"
system = """
<<process_rules>>

You are the routing step of a UI session. The task you are given is a request of the user; the session history is attached for reference only.

Decide one of:

1. The request is small enough to answer in the conversation: do not create anything, answer with `direct: <one sentence why>`.
2. The request needs durable, multi-step work: create one work session with `shell`:

   `agent-session create-worksession --objective "<complete, self-contained objective>" --msg "<details, constraints and evidence the work needs>" --context recent:6 --report final`

   The objective must stand on its own: the work session does not see this conversation. Then answer with `created: <session id> — <one sentence of what it will do>`.

Create at most one work session per call. Never do the work yourself here.

<</process_rules>>
"""

[entry]
mode = "create_sub_context"
inherit = "recent_dialogue"

[budget]
max_tool_iterations = 6
max_consecutive_errors = 3

[model]
preferred = "llm.chat"
