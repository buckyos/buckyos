# Jarvis agent package. Loaded by the OpenDAN Agent Loader (src/frame/opendan);
# session templates are read by libopendan (SessionTemplate).

[runtime]
language = "zh"

# Base `.llm_context` of the sessions the Loader creates. A behavior lays its
# own model / loop / tools / budget over it.
[llm_context]
model = "llm.chat"
max_tokens = 8192

[llm_context.provider]
type = "buckyos"

[llm_context.tools]
enabled = true

[loader]
agent_state_service = true
webui = true
idle_unload_secs = 900

[[loader.ui]]
on = "msg.chat"
session_class = "ui"
sid_strategy = "per_peer"
idle_unload_secs = 900

# Reached only by the owner's @ while the owner allows group chat; the
# request comes with the group's latest messages as context.
[[loader.ui]]
on = "msg.group"
session_class = "group"
sid_strategy = "per_group"
idle_unload_secs = 900

[loader.self_check]
enabled = false

[loader.self_improve]
enabled = false

[session.ui]
default_behavior = "chat_route"
max_process_depth = 4

[session.group]
base = "ui"
default_behavior = "groupchat_route"
max_process_depth = 4

[session.work]
default_behavior = "plan"
max_process_depth = 8
