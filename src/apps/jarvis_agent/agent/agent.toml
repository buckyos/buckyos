# Jarvis agent package. Loaded by the OpenDAN Agent Loader (src/frame/opendan);
# session templates are read by libopendan (SessionTemplate).

[runtime]
language = "zh"

# Base `.llm_context` of the sessions the Loader creates. A behavior lays its
# own model / loop / tools / budget over it. `context_window` is left out on
# purpose: a run takes the window of the model its alias routes to (AICC
# `max_context_tokens`, 128k when unknown); set it here (or in a session's
# `llm_context`) only to override that. Compaction starts at 80% of it
# (`context_yield_ratio`) and brings the request back to 30%.
[llm_context]
model = "llm.chat"
max_tokens = 8192

[llm_context.provider]
type = "buckyos"

[llm_context.tools]
enabled = true

[loader]
agent_state_service = true
webui = true
idle_unload_secs = 900

[[loader.ui]]
on = "msg.chat"
session_class = "ui"
sid_strategy = "per_peer"
idle_unload_secs = 900

# Reached only by the owner's @ while the owner allows group chat; the
# request comes with the group's latest messages as context.
[[loader.ui]]
on = "msg.group"
session_class = "group"
sid_strategy = "per_group"
idle_unload_secs = 900

[loader.self_check]
enabled = false

# Goals of the agent: the Loader creates one Goal Session per goal and epoch
# and offers scheduled run opportunities (local schedule).
[loader.goals]
enabled = true

# A UI session's objective is the built-in design intent of a conversation
# (`objective = "..."` replaces it); its command manuals are frozen with it.
[session.ui]
default_behavior = "chat_route"
default_cmd_skills = ["ui_core"]
max_process_depth = 4

[session.group]
base = "ui"
default_behavior = "groupchat_route"
default_cmd_skills = ["ui_core"]
max_process_depth = 4

# A work session's command manuals are chosen when it is created
# (`create-worksession --cmd-skill`); there is no default. It has many Turns:
# every reply closes one (the progress its caller sees), the end of a task it
# started — or a tick every `tick_secs` while its tasks run — opens the next;
# only `report(is_end=true)` ends it. By default it is a plan session
# (`plan_simple`): it keeps a TodoList whose Todos run in work sessions of
# their own (`work_simple`, `explore`); `--behavior work_simple` makes it one
# bounded task.
[session.work]
default_behavior = "plan_simple"
completion = "explicit_report"
tick_secs = 30
max_process_depth = 8

# The plan session of a conversation (`--class plan_simple`): its queue
# brings it the user's messages forwarded from the conversation (it never
# waits for an answer); it only steers what runs, so its tick is rare (a
# Todo's end is its input).
[session.plan_simple]
base = "work"
default_behavior = "plan_simple"
input = "queue"
tick_secs = 600
max_process_depth = 8
# A plan sees every runtime and workspace to place its Todos.
runtime_view = "all"

# Goal Sessions: every activation is one Turn; what a goal leaves out of its
# budget and schedule comes from here.
[session.goal]
default_behavior = "goal"
max_sub_sessions = 4
min_interval_secs = 60

[session.goal.budget.activation]
max_total_tokens = 300000
max_runs = 6

[session.goal.budget.period]
window_secs = 86400
max_works = 24

# The agent's default Memory maintenance Goal (lifecycle maintain, built in,
# key `builtin:memory_maintenance`): consolidates perceptions into
# cognitions every 30 minutes when there is material (a 2 hour baseline
# check otherwise). Its own budget is set when it is seeded; `decision`
# is the optional model pre-check (off until the AICC decision provider is
# wired).
[session.goal.maintenance]
enabled = true
decision = "off"
behavior = "memory_maintenance"

# The agent's skill maintenance Goal (lifecycle maintain, built in, key
# `builtin:skill_crystallize`): reads recent work sessions by the usage the
# host records (`.meta/skills_state.json`), revises local and imported
# manuals, writes drafts under `skills_drafts/` and recommends cleanups.
# It installs nothing: the owner installs drafts on the Skills page. Off
# until the owner turns it on.
[session.goal.crystallize]
enabled = false
behavior = "skill_crystallize"
