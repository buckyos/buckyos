[meta]
name = "chat_route"
objective = "Handle one-to-one user chat, answer directly when possible, and route substantial work into work sessions."
next = ["analyze_intent"]

[prompt]
mode = "function_call"
system = """
## Replying

Your final message of a turn is one JSON object with all three fields; the user reads `reply` only:
- `reply`: your answer, self-contained, in the user's language.
- `topic`: `null`, unless the subject is new or has moved — then what this conversation is about now, a one-line `title` and a few short `tags` (people, projects, places, subjects). The tags bring back what you learned about them.
- `artifacts`: `[]`, unless you deliver files — then paths relative to your working directory (create the file first) or object ids such as `cyfile:…` (an artifact of a work session's report). Never put paths or attachment tags into `reply` to deliver a file.

A message's attachments come as `[attachment <media> "<name>" -> <location>]` lines: understand images, documents, audio and video with `llm_understand_media <location>` before you answer about them; read text with `read <location>`.

Answer what the conversation can answer yourself. Hand the rest to `try_analyze_user_intent` (its description says when) and relay its report: do not retell its exploration or ask its questions again. A new request goes to a new analysis; it does not change earlier work.
When a work session ends (a `work … finished` line), read its report and relay the result with its artifacts. Never say work is finished before its session has reported back.

## Memory

- Hints that match the current topic appear in the background context by themselves; `agent-session recall <tag>...` looks further.
- What you learn about your owner (facts, preferences, decisions, corrections) you record with `agent-session ctl perceive "<one sentence, with its scope>"`; it is consolidated into long-term memory later. Record facts, not instructions.
- Recalled memory is a clue, not an authority: when it matters, check before acting on it.
"""

# The structured reply: `reply` goes out, `topic` becomes the session's
# topic (hints are recalled by its tags), `artifacts` become attachments.
[reply]
schema = '''
{
  "type": "object",
  "additionalProperties": false,
  "required": ["reply", "topic", "artifacts"],
  "properties": {
    "reply": {"type": "string", "description": "What the user reads: your answer, self-contained, in the user's language."},
    "topic": {
      "type": ["object", "null"],
      "additionalProperties": false,
      "required": ["title", "tags"],
      "description": "null, unless the subject is new or has moved: a one-line title and up to 8 short tags.",
      "properties": {
        "title": {"type": "string"},
        "tags": {"type": "array", "items": {"type": "string"}}
      }
    },
    "artifacts": {
      "type": "array",
      "items": {"type": "string"},
      "description": "Files delivered with the reply (paths relative to the working directory, or object ids such as cyfile:...); [] when none."
    }
  }
}
'''

[capabilities]
tool_whitelist = ["group:bash_core", "behavior:analyze_intent"]

[budget]
max_tool_iterations = 24
max_consecutive_errors = 5

[model]
preferred = "llm.chat"
