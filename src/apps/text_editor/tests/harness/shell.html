<!doctype html><html><head><title>Shell harness</title></head><body><h1 id="title">Shell</h1><button id="close">Close window</button><iframe id="app" style="width:100%;height:650px;border:0"></iframe><script type="module">
import { AppFrameHost } from 'buckyos/app-frame'
const iframe = document.querySelector('#app'), nonce = crypto.randomUUID()
const request = { requestId: crypto.randomUUID(), source: { kind:'cyfs-path',path:'cyfs:///home/test-user/notes/demo.md' } }
window.host = new AppFrameHost({target:()=>iframe.contentWindow,origin:location.origin,init:{nonce,windowId:'test-window',theme:{mode:'light'},locale:'en',formFactor:'desktop',launch:request,shellCapabilities:['content.open','sysdlg/select']},onSystemDialog:async(path,params)=>{window.dialogs.push({path,params});const answer=await new Promise(resolve=>{window.answerDialog=resolve});return answer.code?{ok:false,code:answer.code}:{ok:true,result:answer}},onTitle:(title,dirty)=>document.querySelector('#title').textContent=(dirty?'● ':'')+title,onRequestClose:()=>iframe.remove(),onContentOpen:(request,target,options)=>window.opened.push({request,target,...options})})
window.opened=[];window.dialogs=[]
iframe.src='/#bfp='+nonce
document.querySelector('#close').onclick=async()=>{if(await window.host.beforeClose()==='allow')iframe.remove()}
</script></body></html>
